<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Road to Olympus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Outfit:wght@400;500;600;700&display=swap">
<style>
  /* Layout: one vertical climb, islands zig-zag up a sky that changes with altitude */
  :root{
    color-scheme:dark;
    --ink:#1c1410;--paper:#fff8ec;--gold:#f2c14e;--gold-deep:#a8741f;--muted:#6f5d4c;
    --glass:rgba(24,16,10,.72);--glass-line:rgba(242,193,78,.28);
    --display:'Cinzel',Georgia,'Times New Roman',serif;--body:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;
  }
  html,body{margin:0;background:#0b1030;color:var(--paper);font-family:var(--body);-webkit-tap-highlight-color:transparent}
  #sky{position:fixed;inset:0;z-index:0;background:linear-gradient(var(--sky-top,#f6d9a6),var(--sky-bot,#b9d48f))}
  #stars,#clouds{position:fixed;inset:0;z-index:0;pointer-events:none}
  #stars{opacity:0;background-image:radial-gradient(1.2px 1.2px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 72% 9%,#fff,transparent),radial-gradient(1.4px 1.4px at 38% 42%,#fff,transparent),radial-gradient(1px 1px at 86% 36%,#fff,transparent),radial-gradient(1.2px 1.2px at 24% 70%,#fff,transparent),radial-gradient(1px 1px at 61% 64%,#fff,transparent),radial-gradient(1.3px 1.3px at 92% 82%,#fff,transparent),radial-gradient(1px 1px at 8% 92%,#fff,transparent),radial-gradient(1px 1px at 50% 26%,#fff,transparent);background-size:340px 520px}
  #clouds{opacity:0}
  #clouds i{position:absolute;border-radius:50%;background:rgba(255,255,255,.75);filter:blur(14px)}
  .bar{position:fixed;z-index:5;left:16px;right:16px;top:calc(10px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:20px;background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);max-width:520px;margin:0 auto}
  .lvl{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font:700 18px var(--display);color:#2a1a08;background:radial-gradient(circle at 35% 30%,#ffe59a,var(--gold) 55%,var(--gold-deep));box-shadow:0 0 0 3px rgba(242,193,78,.25)}
  .bar-main{flex:1;min-width:0}
  .bar-main b{display:block;font:700 15px var(--display);letter-spacing:.04em}
  .bar-main span{display:block;font-size:11.5px;color:#d9c7ac;margin:1px 0 6px;font-variant-numeric:tabular-nums}
  .track{height:6px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden}
  .track i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#e9a43a,var(--gold))}
  .how{flex:none;border:0;border-radius:12px;padding:8px 11px;font:600 12px var(--body);color:#2a1a08;background:var(--paper);cursor:pointer}
  .how:focus-visible,.island:focus-visible{outline:3px solid var(--gold);outline-offset:4px}
  main{position:relative;z-index:1;max-width:520px;margin:0 auto;padding-inline:16px;padding-top:120px}
  .stop{position:relative;height:500px;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .island{position:relative;border:0;background:none;padding:0;cursor:pointer;transform:translateX(var(--x,0px));animation:float 6s ease-in-out infinite;animation-delay:var(--d,0s)}
  .island img{display:block;width:min(72vw,280px);height:auto;filter:drop-shadow(0 18px 18px rgba(20,10,0,.28))}
  .stop.locked .island img{filter:grayscale(.85) brightness(.82) drop-shadow(0 18px 18px rgba(20,10,0,.25))}
  .stop.current .island::before{content:"";position:absolute;inset:-12% -18%;border-radius:50%;background:radial-gradient(closest-side,rgba(255,236,170,.75),rgba(255,236,170,0));animation:pulse 3.2s ease-in-out infinite;z-index:-1}
  .lock{position:absolute;left:50%;top:40%;transform:translateX(-50%);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(120,128,150,.92);box-shadow:0 4px 10px rgba(0,0,0,.25)}
  .badge{position:absolute;left:4%;top:46%;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font:700 19px var(--display);color:#2a1a08;background:radial-gradient(circle at 35% 30%,#ffe59a,var(--gold) 55%,var(--gold-deep));border:3px solid #fff8ec;box-shadow:0 6px 16px rgba(120,70,0,.35)}
  .you{position:absolute;right:0;top:26%;display:flex;align-items:center;gap:6px;padding:5px 11px 5px 5px;border-radius:999px;background:#fff8ec;color:#5a3a12;font-weight:700;font-size:12.5px;box-shadow:0 6px 16px rgba(0,0,0,.18)}
  .you i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;color:#2a1a08;background:var(--gold)}
  .label{text-align:center;transform:translateX(var(--x,0px));margin-top:2px}
  .label h3{margin:0;font:700 18px var(--display);letter-spacing:.05em;text-wrap:balance}
  .label p{margin:2px 0 0;font-size:12px;font-variant-numeric:tabular-nums}
  .stop.on-light .label h3{color:var(--ink)}.stop.on-light .label p{color:var(--muted)}
  .stop.on-dark .label h3{color:#fff8ec}.stop.on-dark .label p{color:#c9c3e6}
  .heavens{height:200px;display:grid;place-items:center;text-align:center;font:600 12px var(--body);letter-spacing:.18em;text-transform:uppercase;color:#c9c3e6}
  .hills{position:relative;margin-inline:-16px;margin-top:-40px}
  .hills img{display:block;width:100%;height:auto;-webkit-mask-image:linear-gradient(transparent,#000 18%);mask-image:linear-gradient(transparent,#000 18%)}
  .sheet{position:fixed;z-index:6;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:500px;margin:0 auto;padding:16px 18px 18px;border-radius:22px;background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transform:translateY(130%);transition:transform .35s cubic-bezier(.2,.9,.3,1.15)}
  .sheet.open{transform:none}
  .sheet small{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:700}
  .sheet h2{margin:3px 0 2px;font:700 22px var(--display)}
  .sheet p{margin:0;color:#d9c7ac;font-size:13px;line-height:1.5}
  .sheet .track{margin-top:12px}
  .sheet .row{display:flex;gap:10px;margin-top:14px}
  .sheet button{flex:1;border:0;border-radius:12px;padding:11px;font:600 13px var(--body);cursor:pointer}
  .sheet .primary{background:var(--gold);color:#2a1a08}.sheet .ghost{background:rgba(255,255,255,.1);color:var(--paper)}
  .loading{position:fixed;inset:0;z-index:7;display:grid;place-items:center;font:600 13px var(--body);letter-spacing:.14em;text-transform:uppercase;color:#5a3a12;background:#f7d6a4;transition:opacity .5s}
  .loading.gone{opacity:0;pointer-events:none}
  @keyframes float{0%,100%{translate:0 0}50%{translate:0 -8px}}
  @keyframes pulse{0%,100%{opacity:.75;scale:1}50%{opacity:1;scale:1.06}}
  @media (prefers-reduced-motion: reduce){.island,.stop.current .island::before{animation:none}.sheet{transition:none}}
</style>
</head><body>
<div id="sky"></div><div id="clouds"></div><div id="stars"></div>
<div class="bar" role="status">
  <div class="lvl" id="barLvl">3</div>
  <div class="bar-main"><b id="barName">Hero</b><span id="barSub">11,200 of 16,000 kg to Demigod</span><div class="track"><i id="barFill" style="width:30%"></i></div></div>
  <button class="how" id="how" type="button">How ranks work</button><button class="how" id="closeRoad" type="button" aria-label="Close">Close</button>
</div>
<main id="climb" aria-label="Your climb to Olympus"></main>
<div class="sheet" id="sheet" role="dialog" aria-modal="false" aria-labelledby="sName">
  <small id="sTier"></small><h2 id="sName"></h2><p id="sDesc"></p>
  <div class="track"><i id="sFill"></i></div>
  <div class="row"><button class="ghost" id="sClose" type="button">Close</button></div>
</div>
<div class="loading" id="loading">Raising the statues…</div>

    stop.className='stop '+(unlocked?'':'locked ')+(current?'current ':'')+(altitudeF(i)>.75?'on-dark':'on-light');
    stop.style.setProperty('--x',XS[i]+'px');stop.style.setProperty('--d',(-i*.9)+'s');
    stop.innerHTML=`<button class="island" type="button" aria-label="${t.name}${unlocked?'':' (locked)'}"><img alt="" src="${t._img}" width="${W}" height="${H}">
      ${unlocked?'':'<span class="lock" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span>'}
      ${current?`<span class="badge">${i+1}</span><span class="you"><i>${INITIAL}</i>You</span>`:''}</button>
      <div class="label"><h3>${t.name}</h3><p>${t.need?t.need.toLocaleString()+' kg lifted':'Where every lifter starts'}</p></div>`;
    stop.querySelector('.island').addEventListener('click',()=>openSheet(i));
    climb.appendChild(stop);
  }
  const hills=document.createElement('div');hills.className='hills';hills.innerHTML=`<img alt="A Greek harbour town beneath Mount Olympus" src="${HARBOUR_IMG}">`;
  climb.appendChild(hills);
  // header
  const cur=TIER_DATA[curIdx],next=TIER_DATA[curIdx+1];
  document.getElementById('barLvl').textContent=curIdx+1;document.getElementById('barName').textContent=cur.name;
  document.getElementById('barSub').textContent=next?`${userKg.toLocaleString()} of ${next.need.toLocaleString()} kg to ${next.name}`:'The summit — God of Gods';
  document.getElementById('barFill').style.width=(next?Math.round((userKg-cur.need)/(next.need-cur.need)*100):100)+'%';
}
// clouds drift through the middle of the climb
{const cl=document.getElementById('clouds');[[8,22,180,60],[60,38,220,70],[20,58,160,50],[70,74,200,64],[-10,86,240,70]].forEach(([x,y,w,h])=>{const i=document.createElement('i');Object.assign(i.style,{left:x+'%',top:y+'%',width:w+'px',height:h+'px'});cl.appendChild(i);});}
// sky colour follows altitude: hills at dawn → open sky → golden Olympus → night
const SKY=[[0,'#f7d6a4','#f3e2c0'],[.38,'#8ec5ea','#e4f2f7'],[.68,'#f0bf5a','#fbe6b0'],[1,'#0b1030','#2c2a62']];
const mix=(a,b,t)=>{const pa=parseInt(a.slice(1),16),pb=parseInt(b.slice(1),16);const c=[16,8,0].map(s=>Math.round(((pa>>s)&255)*(1-t)+((pb>>s)&255)*t));return'#'+c.map(v=>v.toString(16).padStart(2,'0')).join('');};
const ss=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t);};
function onScroll(){
  const max=document.documentElement.scrollHeight-innerHeight;const f=max>0?1-scrollY/max:0;
  let k=0;while(k<SKY.length-2&&f>SKY[k+1][0])k++;
  const [a,t1,b1]=SKY[k],[b,t2,b2]=SKY[k+1];const t=ss(a,b,f);
  const sky=document.getElementById('sky');sky.style.setProperty('--sky-top',mix(t1,t2,t));sky.style.setProperty('--sky-bot',mix(b1,b2,t));
  document.getElementById('stars').style.opacity=ss(.72,.95,f);
  document.getElementById('clouds').style.opacity=Math.max(0,1-Math.abs(f-.45)/.28)*.9;
}
addEventListener('scroll',onScroll,{passive:true});addEventListener('resize',onScroll);
// detail sheet
const sheet=document.getElementById('sheet');
function openSheet(i){
  const t=TIER_DATA[i],unlocked=TIER_DATA.indexOf(t)<=userRank;
  document.getElementById('sTier').textContent='Tier '+(i+1)+(i===curIdx?' · you are here':unlocked?' · reached':' · locked');
  document.getElementById('sName').textContent=t.name;
  document.getElementById('sDesc').textContent=MATERIAL_NAME[t.key]+'. '+t.req+'.';
  document.getElementById('sFill').style.width=(unlocked?100:Math.min(100,Math.round(userKg/t.need*100)))+'%';
  sheet.classList.add('open');
}
document.getElementById('sClose').addEventListener('click',()=>sheet.classList.remove('open'));
document.getElementById('closeRoad').addEventListener('click',()=>{try{parent.postMessage({type:'arx-hall-close'},'*')}catch(e){}});
document.getElementById('how').addEventListener('click',()=>{
  document.getElementById('sTier').textContent='How ranks work';document.getElementById('sName').textContent='Lift your way up';
  document.getElementById('sDesc').textContent='Every kilogram you lift counts toward your rank. Each statue marks a new tier, from Atlas in bronze at the foot of the mountain to Zeus himself at the summit.';
  document.getElementById('sFill').style.width=document.getElementById('barFill').style.width;sheet.classList.add('open');
});
// build all island images, then start at your current tier
const imgs=await Promise.all(TIER_DATA.map(t=>loadImg(STATUE_IMG[t.key].src)));
TIER_DATA.forEach((t,i)=>{t._img=shoot(i,t,i<=userRank,imgs[i]);});
const HARBOUR_IMG=shootHarbour();
renderer.dispose();
render();
requestAnimationFrame(()=>{const el=climb.querySelector('.stop.current');if(el)el.scrollIntoView({block:'center'});onScroll();document.getElementById('loading').classList.add('gone');});
window.__ready=true;
</script>
</body></html>
