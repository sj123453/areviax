<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 391 749">
  <!-- Tier 1: Common Folk — the entry rank, deliberately plain: no
       armor, no laurel, no adornment, a single low plinth. Every later
       tier in this set (soldier/hero/demigod/god/king-of-the-gods)
       builds visibly ON TOP of this same base body silhouette. -->

  <!-- single-tier plinth — plainest of all six -->
  <rect x="70" y="708" width="251" height="41" rx="2"/>

  <!-- feet -->
  <path d="M128 682 L182 682 L186 700 L120 700 Z"/>
  <path d="M209 682 L263 682 L271 700 L201 700 Z"/>

  <!-- legs -->
  <path d="M150 486 L241 486 L241 560 L226 682 L186 682 L179 560 L179 610 L172 682 L132 682 L146 560 Z"/>

  <!-- torso + arms -->
  <path d="M195.5 280
           C 150 280 108 296 98 332
           L 90 470
           C 89 488 100 500 118 500
           L 150 500
           L 150 486
           L 241 486
           L 241 500
           L 273 500
           C 291 500 302 488 301 470
           L 293 332
           C 283 296 241 280 195.5 280 Z"/>

  <!-- neck -->
  <rect x="176" y="255" width="39" height="30"/>

  <!-- head -->
  <ellipse cx="195.5" cy="216" rx="46" ry="50"/>

  <!-- plain, flat hair — no crown, no curls, nothing earned yet -->
  <path d="M151 198
           C 151 174 170 160 195.5 160
           C 221 160 240 174 240 198
           C 240 202 238 205 235 205
           L 156 205
           C 153 205 151 202 151 198 Z"/>
</svg>
