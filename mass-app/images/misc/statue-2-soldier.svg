<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 391 749">
  <!-- Tier 2: Soldier — armed and armored: a crested Corinthian-style
       helmet replaces the bare head, a round shield bulks out one side,
       and the plinth steps up to two tiers. -->

  <!-- two-tier plinth -->
  <rect x="58" y="700" width="275" height="16" rx="2"/>
  <rect x="80" y="716" width="231" height="33" rx="2"/>

  <!-- feet -->
  <path d="M128 682 L182 682 L186 700 L120 700 Z"/>
  <path d="M209 682 L263 682 L271 700 L201 700 Z"/>

  <!-- legs -->
  <path d="M150 486 L241 486 L241 560 L226 682 L186 682 L179 560 L179 610 L172 682 L132 682 L146 560 Z"/>

  <!-- round shield, held at the left side — sits BEHIND the torso so the
       arm still reads on top of it -->
  <ellipse cx="72" cy="400" rx="58" ry="66"/>

  <!-- torso + arms -->
  <path d="M195.5 280
           C 150 280 108 296 98 332
           L 90 470
           C 89 488 100 500 118 500
           L 150 500
           L 150 486
           L 241 486
           L 241 500
           L 273 500
           C 291 500 302 488 301 470
           L 293 332
           C 283 296 241 280 195.5 280 Z"/>

  <!-- neck -->
  <rect x="176" y="255" width="39" height="30"/>

  <!-- helmet dome + flared cheek-guards, sitting lower/wider than a bare
       head to read clearly as protective gear -->
  <path d="M195.5 155
           C 228 155 253 180 253 214
           C 253 236 249 252 244 264
           L 231 264 L 231 226 L 226 264
           L 165 264 L 160 226 L 160 264
           L 147 264
           C 142 252 138 236 138 214
           C 138 180 163 155 195.5 155 Z"/>

  <!-- helmet crest — a raised fin from brow to nape -->
  <path d="M195.5 128
           C 205 128 212 138 212 150
           L 212 172
           C 212 178 204 182 195.5 182
           C 187 182 179 178 179 172
           L 179 150
           C 179 138 186 128 195.5 128 Z"/>
</svg>
