<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 391 749">
  <!-- Tier 3: Hero — the armor comes off, replaced by a laurel wreath
       and a wind-caught cape: celebrated now, not just equipped. -->

  <!-- two-tier plinth -->
  <rect x="58" y="700" width="275" height="16" rx="2"/>
  <rect x="80" y="716" width="231" height="33" rx="2"/>

  <!-- feet -->
  <path d="M128 682 L182 682 L186 700 L120 700 Z"/>
  <path d="M209 682 L263 682 L271 700 L201 700 Z"/>

  <!-- legs -->
  <path d="M150 486 L241 486 L241 560 L226 682 L186 682 L179 560 L179 610 L172 682 L132 682 L146 560 Z"/>

  <!-- cape, caught mid-motion off the right shoulder, sweeping out past
       the leg — drawn BEHIND the torso -->
  <path d="M275 322
           C 320 340 345 390 338 450
           C 332 510 300 560 315 650
           L 260 650
           C 255 560 262 500 258 450
           C 254 400 260 355 275 322 Z"/>

  <!-- torso + arms -->
  <path d="M195.5 280
           C 150 280 108 296 98 332
           L 90 470
           C 89 488 100 500 118 500
           L 150 500
           L 150 486
           L 241 486
           L 241 500
           L 273 500
           C 291 500 302 488 301 470
           L 293 332
           C 283 296 241 280 195.5 280 Z"/>

  <!-- neck -->
  <rect x="176" y="255" width="39" height="30"/>

  <!-- head -->
  <ellipse cx="195.5" cy="216" rx="46" ry="50"/>

  <!-- laurel wreath — a thin band with small leaf tufts either side,
       leaving the crown of the head bare (unlike the soldier's full
       helmet or the common-folk's flat hair) -->
  <path d="M151 202 C 151 192 160 185 172 183 L 172 194 C 164 196 160 199 160 205 Z"/>
  <path d="M240 202 C 240 192 231 185 219 183 L 219 194 C 227 196 231 199 231 205 Z"/>
  <path d="M158 186 L 148 178 L 156 172 L 164 180 Z"/>
  <path d="M168 178 L 160 168 L 169 164 L 176 174 Z"/>
  <path d="M233 186 L 243 178 L 235 172 L 227 180 Z"/>
  <path d="M223 178 L 231 168 L 222 164 L 215 174 Z"/>
</svg>
