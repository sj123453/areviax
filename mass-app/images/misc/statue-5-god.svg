<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 391 749">
  <!-- Tier 5: God — full wings, a thunderbolt in hand, and a third band
       added to the plinth. The aura from Demigod is gone; it isn't
       needed once you're visibly no longer mortal. -->

  <!-- three-tier plinth -->
  <rect x="50" y="694" width="291" height="14" rx="2"/>
  <rect x="58" y="708" width="275" height="16" rx="2"/>
  <rect x="80" y="724" width="231" height="25" rx="2"/>

  <!-- wings — a fan of three overlapping triangular feathers per side,
       radiating from the shoulder. Straight-edged and bold on purpose:
       an earlier curved-outline attempt rendered as a thin crescent
       sliver instead of a real wing shape at this size. -->
  <path d="M95 322 L 4 336 L 66 382 Z"/>
  <path d="M88 356 L -20 400 L 50 434 Z"/>
  <path d="M80 400 L -8 470 L 58 480 Z"/>
  <path d="M296 322 L 387 336 L 325 382 Z"/>
  <path d="M303 356 L 411 400 L 341 434 Z"/>
  <path d="M311 400 L 399 470 L 333 480 Z"/>

  <!-- feet -->
  <path d="M128 682 L182 682 L186 700 L120 700 Z"/>
  <path d="M209 682 L263 682 L271 700 L201 700 Z"/>

  <!-- legs -->
  <path d="M150 486 L241 486 L241 560 L226 682 L186 682 L179 560 L179 610 L172 682 L132 682 L146 560 Z"/>

  <!-- torso + arms -->
  <path d="M195.5 280
           C 150 280 108 296 98 332
           L 90 470
           C 89 488 100 500 118 500
           L 150 500
           L 150 486
           L 241 486
           L 241 500
           L 273 500
           C 291 500 302 488 301 470
           L 293 332
           C 283 296 241 280 195.5 280 Z"/>

  <!-- thunderbolt, held out clear of the torso so its zigzag actually
