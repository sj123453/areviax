<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 391 749">
  <!-- Tier 6: King of the Gods — the wreath becomes a spiked crown, the
       thunderbolt becomes a full raised sceptre, an eagle stands at the
       foot of the plinth, and the plinth itself gets its fourth and
       final tier. The top of this ladder. -->

  <!-- four-tier plinth, most ornate of the set -->
  <rect x="44" y="686" width="303" height="12" rx="2"/>
  <rect x="50" y="698" width="291" height="14" rx="2"/>
  <rect x="58" y="712" width="275" height="16" rx="2"/>
  <rect x="80" y="728" width="231" height="21" rx="2"/>

  <!-- eagle, standing beside the foot of the plinth — kept as a simple,
       bold silhouette (body + two spread wing triangles + a beak) rather
       than a fussy multi-curve shape, so it reads clearly at thumbnail
       size instead of collapsing into a blob -->
  <g>
    <ellipse cx="345" cy="668" rx="20" ry="30"/>
    <path d="M334 648 L268 610 L310 660 L334 664 Z"/>
    <path d="M356 648 L422 610 L380 660 L356 664 Z"/>
    <path d="M340 642 L320 626 L344 634 Z"/>
    <rect x="337" y="696" width="7" height="16"/>
    <rect x="352" y="696" width="7" height="16"/>
  </g>

  <!-- feet -->
  <path d="M128 682 L182 682 L186 700 L120 700 Z"/>
  <path d="M209 682 L263 682 L271 700 L201 700 Z"/>

  <!-- wings — same bold triangular-feather fan as the God tier, sized
       up slightly as the largest in the set -->
  <path d="M95 318 L -6 334 L 62 386 Z"/>
  <path d="M87 356 L -34 406 L 46 444 Z"/>
  <path d="M78 404 L -20 482 L 56 494 Z"/>
  <path d="M296 318 L 397 334 L 329 386 Z"/>
  <path d="M304 356 L 425 406 L 345 444 Z"/>
  <path d="M313 404 L 411 482 L 335 494 Z"/>

  <!-- legs -->
  <path d="M150 486 L241 486 L241 560 L226 682 L186 682 L179 560 L179 610 L172 682 L132 682 L146 560 Z"/>

  <!-- torso + arms -->
  <path d="M195.5 280
           C 150 280 108 296 98 332
           L 90 470
           C 89 488 100 500 118 500
           L 150 500
           L 150 486
           L 241 486
           L 241 500
           L 273 500
           C 291 500 302 488 301 470
           L 293 332
           C 283 296 241 280 195.5 280 Z"/>

  <!-- sceptre, raised well clear of both the torso and the crown so its
       full length actually reads instead of merging into the body -->
  <path d="M303 486 L328 486 L314 390 L338 390 L300 150 L318 330 L294 330 Z"/>

  <!-- neck -->
  <rect x="176" y="255" width="39" height="30"/>

  <!-- head -->
  <ellipse cx="195.5" cy="216" rx="46" ry="50"/>

  <!-- crown — a band with five rising points, replacing every earlier
       tier's headwear -->
  <rect x="153" y="178" width="85" height="16" rx="2"/>
  <path d="M158 178 L166 148 L174 178 Z"/>
  <path d="M180 178 L191 140 L202 178 Z"/>
  <path d="M195.5 178 L195.5 132 L207 178 Z"/>
  <path d="M212 178 L223 148 L231 178 Z"/>
  <path d="M225 178 L233 156 L239 178 Z"/>
</svg>
