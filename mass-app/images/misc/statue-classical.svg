<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 391 749">
  <!-- A classical kouros-style statue silhouette on its own pedestal,
       replacing the old generic walking-person mask (statue-mask.png).
       Used purely as a mask: shape = visible, empty canvas = transparent,
       the actual per-tier metal colour/gradient is painted on top of it
       by the CSS that references this file. -->

  <!-- pedestal, two-tier so it clearly reads as "on a plinth" even at
       thumbnail size -->
  <rect x="58" y="700" width="275" height="16" rx="2"/>
  <rect x="80" y="716" width="231" height="33" rx="2"/>

  <!-- feet, slight stance -->
  <path d="M128 682 L182 682 L186 700 L120 700 Z"/>
  <path d="M209 682 L263 682 L271 700 L201 700 Z"/>

  <!-- legs, together at the hip, a narrow gap opening toward the ankles -->
  <path d="M150 486 L241 486 L241 560 L226 682 L186 682 L179 560 L179 610 L172 682 L132 682 L146 560 Z"/>

  <!-- torso + arms as one broad silhouette block (shoulders wide,
       tapering to the waist) — fine anatomical gaps between arm and
       torso don't survive an 80px-wide render anyway, so the outline
       itself carries the "statue" read -->
  <path d="M195.5 280
           C 150 280 108 296 98 332
           L 90 470
           C 89 488 100 500 118 500
           L 150 500
           L 150 486
           L 241 486
           L 241 500
           L 273 500
           C 291 500 302 488 301 470
           L 293 332
           C 283 296 241 280 195.5 280 Z"/>

  <!-- neck -->
  <rect x="176" y="255" width="39" height="30"/>

  <!-- head -->
  <ellipse cx="195.5" cy="216" rx="46" ry="50"/>

  <!-- archaic-style beaded curls crowning the head, the single most
       distinct silhouette cue vs. an ordinary modern haircut -->
  <path d="M149.5 206
           C 149.5 172 169 150 195.5 150
           C 222 150 241.5 172 241.5 206
           C 234 198 227 206 220 198
           C 213 206 206 198 199 206
           C 192 198 185 206 178 198
           C 171 206 164 198 157 206
           C 155 202 152 204 149.5 206 Z"/>
</svg>
