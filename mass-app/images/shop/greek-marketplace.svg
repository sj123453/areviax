<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="stoneCol" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4A3620" stop-opacity=".92"/>
      <stop offset="50%" stop-color="#6B4E2C" stop-opacity=".92"/>
      <stop offset="100%" stop-color="#3E2C18" stop-opacity=".92"/>
    </linearGradient>
  </defs>

  <!-- foreground colonnade + market props only — the temple/hillside
       photo underneath already supplies sky and distance, this layer
       just needs to read as "marketplace" in the frame around it. -->
  <g fill="url(#stoneCol)">
    <rect x="40" y="330" width="42" height="370" rx="2"/>
    <rect x="30" y="316" width="62" height="18" rx="3"/>
    <rect x="24" y="686" width="74" height="14" rx="2"/>
    <rect x="1118" y="330" width="42" height="370" rx="2"/>
    <rect x="1108" y="316" width="62" height="18" rx="3"/>
    <rect x="1102" y="686" width="74" height="14" rx="2"/>
  </g>

  <!-- strung awning between the two far columns, gentle catenary sag -->
  <path d="M82 356 Q600 420 1118 356 L1118 372 Q600 436 82 372 Z" fill="#7A2E22" opacity=".88"/>
  <path d="M82 356 Q600 420 1118 356" fill="none" stroke="#4A1B14" stroke-width="3" opacity=".6"/>

  <!-- left market stall: canvas canopy on poles + goods table -->
  <g>
    <rect x="130" y="470" width="10" height="150" fill="#3E2C18"/>
    <rect x="300" y="470" width="10" height="150" fill="#3E2C18"/>
    <path d="M118 470 L322 470 L300 430 L140 430 Z" fill="#B4472E"/>
    <g fill="#E9C77E">
      <polygon points="140,430 172,430 156,458"/>
      <polygon points="196,430 228,430 212,458"/>
      <polygon points="252,430 284,430 268,458"/>
    </g>
    <rect x="130" y="600" width="180" height="70" fill="#5A3D24"/>
    <rect x="130" y="600" width="180" height="10" fill="#755029"/>
    <g fill="#C97A3D">
      <ellipse cx="165" cy="595" rx="14" ry="9"/>
      <path d="M151 595 q0 -38 14 -38 q14 0 14 38 z"/>
      <ellipse cx="205" cy="598" rx="11" ry="7"/>
      <path d="M194 598 q0 -28 11 -28 q11 0 11 28 z"/>
      <ellipse cx="250" cy="596" rx="13" ry="8"/>
      <path d="M237 596 q0 -34 13 -34 q13 0 13 34 z"/>
    </g>
  </g>

  <!-- right market stall -->
  <g>
    <rect x="895" y="470" width="10" height="150" fill="#3E2C18"/>
    <rect x="1065" y="470" width="10" height="150" fill="#3E2C18"/>
    <path d="M883 470 L1087 470 L1065 430 L905 430 Z" fill="#3E6E5B"/>
    <g fill="#E9C77E">
      <polygon points="905,430 937,430 921,458"/>
      <polygon points="961,430 993,430 977,458"/>
      <polygon points="1017,430 1049,430 1033,458"/>
    </g>
    <rect x="895" y="600" width="180" height="70" fill="#5A3D24"/>
    <rect x="895" y="600" width="180" height="10" fill="#755029"/>
    <g fill="#D9B45C">
      <circle cx="935" cy="592" r="17"/>
      <circle cx="968" cy="597" r="13"/>
      <circle cx="1005" cy="594" r="15"/>
      <circle cx="1040" cy="598" r="12"/>
    </g>
  </g>

  <!-- ground shadow strip to seat the props on the photo below -->
  <rect x="0" y="670" width="1200" height="30" fill="#1A0F06" opacity=".35"/>
</svg>
