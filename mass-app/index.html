<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Areviax Mass</title>
<meta http-equiv="refresh" content="0; url=../">
<style>body{margin:0;background:#0D0806;color:#c9b8a6;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}a{color:#e8a45c}</style>
<script>
// The live app is the repo-root index.html (built by build_deploy.py).
// This path used to hold an old, separately-built copy of the app. It
// shares the same origin — and so the same localStorage — as the real
// one, so opening it let outdated code read and rewrite the real app's
// saved data. It now only forwards to the real app, after removing any
// service worker an earlier install registered at this path.
(function(){
  function go(){location.replace('../'+location.search+location.hash);}
  try{
    if('serviceWorker' in navigator&&navigator.serviceWorker.getRegistrations){
      navigator.serviceWorker.getRegistrations().then(function(regs){
        return Promise.all(regs.filter(function(r){return /\/mass-app\/$/.test(r.scope);}).map(function(r){return r.unregister();}));
      }).then(go,go);
      return;
    }
  }catch(e){}
  go();
})();
</script>
</head>
<body>
<p>Opening Areviax Mass… <a href="../">Tap here if nothing happens.</a></p>
</body>
</html>
